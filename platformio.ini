[env:esp32-s3-devkitc1-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
lib_deps = 
	madhephaestus/ESP32Encoder@^0.12.0
	https://github.com/NiiRoboKen/esp-can.git
	git@github.com:hukasigi/peer-link_hukas.git
	git@github.com:coryjfowler/MCP_CAN_lib.git
monitor_speed = 115200
